server.port=5001
server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=false

# SQLite configuration
spring.datasource.url=jdbc:sqlite:./database/civic_tracker.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Hibernate DDL — update will create/alter tables without dropping data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Secret (change this in production!)
app.jwt.secret=4f7a6a4d7b326a273f5d5b786f3b5e4a3b7c2d6e4a2d3b4a2e5c6a4e2f3d6b5e
app.jwt.expirationMs=604800000

# File Upload Configuration (10 MB max)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Upload directory (relative to the backend folder when running locally)
app.upload.dir=./uploads

# Optional local configuration override (git-ignored)
spring.config.import=optional:file:./local.properties

# Groq API Key for AI features (can be overridden by environment variable GROQ_API_KEY or local.properties)
app.groq.api.key=${GROQ_API_KEY:gsk_placeholder_key}

